[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zerith-inference"
version = "0.1.0"
description = "ZERITH 2.5 H1 model and GPU inference service"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/Apache-2.0.txt"]
dependencies = [
  "zerith-client==0.1.0",
  "numpy>=1.26,<3",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "safetensors>=0.6,<1",
  "opencv-python-headless==4.12.0.88",
  "einops>=0.8,<1",
  "huggingface-hub>=0.28,<1",
  "pillow>=12.3,<13",
  "timm>=1,<2",
]

[project.scripts]
zerith-server = "zerith.server:main"
zerith-replay = "zerith.replay:main"
zerith-artifact = "zerith.artifact:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["zerith*", "zerith_core*"]
